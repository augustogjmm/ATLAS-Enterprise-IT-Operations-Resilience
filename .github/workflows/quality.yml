name: ATLAS · Calidad y reproducibilidad
on:
  push:
    branches: [main, feature/**]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificación de sintaxis
        run: npm run check
      - name: Pruebas del motor de simulación
        run: npm test
      - name: Construcción del sitio estático
        run: npm run build
      - name: Verificación de archivos generados
        run: |
          test -f dist/index.html
          test -f dist/app.js
          test -f dist/lib/data.js
          test -f dist/lib/engine.js
      # No credentials, package installs, external API calls or deployment side effects.
